name: Publish to GitHub Packages

# Publishes @max-network/hono-cms-core from the org's shared definition in
# max-network/.github.
#
# The trigger changed. This used to publish ONLY from a published GitHub Release, which is
# the bug worker-utils, billing, text-search and i18n each already fixed in their own copy
# of this file. RELEASING IS NOW BUMPING THE VERSION IN YOUR PR; a merge whose version is
# already on the registry publishes nothing and says so in the run summary.
on:
  push:
    branches: [main]
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    uses: max-network/.github/.github/workflows/publish-package.yml@main
    with:
      check-steps: "typecheck build"
      tag-release: true
    secrets: inherit
