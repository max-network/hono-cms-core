name: Check

# The quality gate for pull requests, and the gate publish.yml reuses so a release runs the
# identical suite. This repo previously had NO pull-request checks at all: publish.yml was
# the only workflow and it ran only on a published Release, so a PR could merge unverified.
#
# NOT the org's shared workflow, unlike hono-ui and mcp-oauth. This repository is PUBLIC and
# max-network/.github is private; a public repo cannot call a private repo's reusable
# workflow, and doing so fails at startup with no job and no log. Making the shared repo
# public would let this repo join the rest. Until that call is made, this file is a
# deliberate local copy and will drift -- which is the whole problem the shared workflows
# were extracted to solve, so it is worth revisiting rather than leaving as the status quo.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  check:
    name: typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@max-network"
          cache: npm

      # GH_PACKAGES_TOKEN, not GITHUB_TOKEN: the latter is scoped to THIS repo and cannot read
      # another repo's private package, which is what @max-network/seo is. Same secret the other
      # max-network repos install with. Falls back so the workflow still runs without it.
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
