name: Publish to GitHub Packages

on:
  push:
    branches: [main]
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    uses: max-network/.github/.github/workflows/publish-package.yml@main
    with:
      check-steps: "typecheck test build"
      tag-release: true
    secrets: inherit
